# Config for the `rebase` utility; see `../prj/rebase`.
#
# `checkout` is the revset the working copy moves to (via `jj new`) after an
# update.  Defaults: fork-track repos use the upstream ref, own repos use
# trunk(); fork-rebase repos stay put unless `checkout` is set.

root = "~/usr/src"

# Forks: upstream + bookmarks to rebase

[repos.helix]
clone = "git@github.com:jeffs/helix.git"
upstream = "https://github.com/helix-editor/helix"
bookmarks = ["custom"]
checkout = "custom"
upstream_ref = "master"
build = ["cargo install --path helix-term"]

[repos.md-tui]
clone = "git@github.com:jeffs/md-tui.git"
upstream = "https://github.com/henriklovhaug/md-tui"
bookmarks = ["custom"]
checkout = "custom"
upstream_ref = "main"
build = ["cargo install --path ."]

[repos.viddy]
clone = "git@github.com:jeffs/viddy.git"
upstream = "https://github.com/sachaos/viddy"
bookmarks = ["custom"]
checkout = "custom"
upstream_ref = "master"
build = ["cargo install --path ."]

