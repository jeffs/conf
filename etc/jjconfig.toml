#:schema https://docs.jj-vcs.dev/latest/config-schema.json
#
# Jujutsu configuration.
#
# # TODO
#
# Wrap JJ to automatically:
# 
# - Rebase local changes when upstream bookmarks have advanced
# - Rebase local branches onto trunk
# - Track position of each user workstation, (host1@origin, host2@origin, etc.)

[aliases] 
di = ["diff"]
e = ["edit"]

# Remote bookmarks applied directly to my changes.
lb = ["log", "-r", "remote_bookmarks() & mine()", "--no-graph", "-T", "bookmark_list"]

flog = ["log", "-r", "first_ancestors(@)", "--no-graph", "-T", "builtin_log_oneline"]
glog = ["log", "-r", "first_ancestors(@)"]

# Refresh the bookmark-to-pull-request table that format_pr_refs() reads.
prsync = ["util", "exec", "--", "pr-sync"]

[colors]
"diff token" = { underline = false }
pr = "cyan"

[user]
name = "Jeff Schwab"
email = "jeff@unbuggy.com"

[revset-aliases]

# Local bookmarks, plus heads I authored, minus heads I've "archived" by
# slapping `ar/` prefixed remote bookmarks on them, minus untracked remote
# bookmarks -- someone else's branch that squash-merged a review of mine is
# theirs, not mine; if I want it back, I'll track it. `~` and `&` bind equally
# and associate left to right, and `|` is weaker, so both exclusions apply
# only to the `visible_heads()` term: a local bookmark sharing a commit with
# an untracked remote one still shows.
#
# TODO: Alias `ar` to archive a bookmark: rename, push, untrack, delete.
'active_heads()' = 'bookmarks() | (visible_heads() & mine()) ~ remote_bookmarks(glob:"ar/*") ~ untracked_remote_bookmarks()'
'interesting()' = '@ | trunk() | active_heads()'

# My unmerged work: commits I authored that sit on an active head and that
# trunk has not absorbed. `trunk()..` tests ancestry, so a squash-merged PR
# leaves its local commit outside trunk forever; confining the search to
# active_heads() is what keeps those landed commits out of the view.
'my_work()' = '(trunk()..active_heads()) & mine()'

# Per-branch truncation: every head in x keeps its last N commits plus the
# branch root; jj elides the middle with `~`. `ancestors(heads(x), N)` is a
# depth window applied per head (topological, unlike `latest()`).
'sparse(x)' = '(ancestors(heads(x), 40) & x) | roots(x)'

[revsets]
# Plain `jj log` with no -r: default scope, long branches elided per-branch.
log = '@ | sparse(immutable_heads()..) | present(trunk())'

[template-aliases]
bookmark_list = '''
separate("\t", change_id.short(), commit_id.short(), bookmarks) ++ "\n"
'''

# Label each bookmark with the pull request open on it. A template cannot reach
# the network, so the numbers come from a `pr` table in repo config that the
# `prsync` alias rewrites from `gh pr list`; a bookmark absent from that table
# renders nothing, and separate() then drops it.
'pr_number(bookmark)' = 'config("pr.\"" ++ bookmark.name() ++ "\"")'
'format_pr_refs(commit)' = '''
commit.local_bookmarks()
  .filter(|bookmark| pr_number(bookmark))
  .map(|bookmark| label("pr", "PR#" ++ pr_number(bookmark)))
  .join(" ")
'''

# jj 0.43's own definition, with format_pr_refs() spliced in after the
# bookmarks. Every builtin log template draws its first line from this one, so
# the pull request numbers reach compact, oneline, and comfortable alike.
'format_short_commit_header(commit)' = '''
separate(" ",
  format_short_change_id_with_change_offset(commit),
  format_short_signature(commit.author()),
  format_timestamp(commit_timestamp(commit)),
  commit.bookmarks(),
  format_pr_refs(commit),
  commit.tags(),
  commit.working_copies(),
  format_short_commit_id(commit.commit_id()),
  format_commit_labels(commit),
  if(config("ui.show-cryptographic-signatures").as_boolean(),
    format_short_cryptographic_signature(commit.signature())
  ),
)
'''

[ui]
pager = "delta"
diff-formatter = ":git"

# Meant to show whatever I'm actively working on: every active branch tip, plus
# my own unmerged commits behind those tips, with long stacks elided per-branch
# by sparse(). Trunk contributes only its tip, so a branch that has fallen weeks
# behind costs nothing.
default-command = ["log", "-r", "interesting() | sparse(my_work())"]

# Same, but showing every commit on every active branch, whoever wrote it.
# default-command = ["log", "-r", "interesting() | sparse(trunk()..active_heads())"]
diff-editor = ":builtin"

# Works, but doesn't show the set of "active" branches; it's more like my old `git glog`.
# default-command = ["log", "-r", "trunk()::first_ancestors(@)"]

# An attempt to filter out "archived" bookmarks.
# default-command = ["log", "-r", "@ | trunk() | bookmarks() ~ bookmarks(glob:ar/*)"]

# Don't fetch upstream tags. `fetch-tags` takes a string pattern (not a revset)
# and has no "match nothing" value -- "" produces an invalid refspec -- so this
# names a tag that will never exist. Per-remote; literal names only, no globs.
[remotes.origin]
fetch-tags = "exact:jj-fetch-no-tags-sentinel"
